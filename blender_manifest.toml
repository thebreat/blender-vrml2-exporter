schema_version = "1.0.0"

id = "io_scene_vrml2_export"
version = "0.7.0-alpha.8"
name = "VRML2 Exporter"
tagline = "Export mesh objects to VRML2 with colors and textures"
maintainer = "thebreat"
website = "https://github.com/thebreat/blender-vrml2-exporter"
type = "add-on"

tags = ["Import-Export"]
blender_version_min = "4.2.0"
license = ["SPDX:GPL-3.0-or-later"]

[build]
paths_exclude_pattern = [
    "__pycache__/",
    ".git",
    "*.zip",
    "tests/",
    "VALIDATION.md",
]

[permissions]
files = "Write .wrl/.wrz files and optionally copy textures"
